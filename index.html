<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PawanRadar</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <style>
      :root {
        --border: #E4E1D8;
        --text-primary: #2B2A27;
        --text-secondary: #6B6A63;
        --text-muted: #9B9A93;
        --radius: 8px;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: #FBFAF7;
        color: var(--text-primary);
        margin: 0;
        padding: 24px 16px 60px;
      }
      .wrap { max-width: 760px; margin: 0 auto; }
      .header {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-bottom: 18px;
        gap: 12px;
      }
      .title-group { display: flex; align-items: center; gap: 12px; }
      .logo-icon { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; }
      .title { font-size: 28px; font-weight: 700; }
      .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .updated { font-size: 12px; color: var(--text-muted); }
      select, button {
        font-size: 13px;
        font-family: inherit;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text-primary);
        cursor: pointer;
      }
      button#refreshBtn {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #2B2A27;
        color: #fff;
        border: none;
      }
      button#refreshBtn:disabled { opacity: 0.6; cursor: default; }
      #rows { display: flex; flex-direction: column; gap: 8px; }
      .card {
        border: 1px solid var(--border);
        border-left: 4px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
        background: #fff;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
      }
      .ticker-price { display: flex; align-items: baseline; gap: 10px; }
      .ticker { font-size: 16px; font-weight: 600; }
      .price { font-size: 15px; }
      .atr-value { font-size: 11px; color: var(--text-muted); }
      .badge {
        font-size: 12px;
        font-weight: 500;
        padding: 3px 10px;
        border-radius: 12px;
      }
      .no-signal { font-size: 12px; color: var(--text-muted); }
      .signal-badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 5px 14px; border-radius: 14px; margin-bottom: 10px; }
      .badges-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
      .indicator-badge { font-size: 11px; padding: 3px 9px; border-radius: 12px; white-space: nowrap; }
      .windows-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
        gap: 10px;
      }
      .win-label { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
      .win-low { font-size: 13px; }
      .win-high { font-size: 12px; color: var(--text-secondary); }
      .win-na { font-size: 12px; color: var(--text-muted); }
      .error-card { font-size: 13px; color: #A32D2D; }
      .legend { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0 16px; font-size: 11px; color: var(--text-secondary); }
      .legend span { display: inline-flex; align-items: center; gap: 4px; }
      .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
      .empty-state { text-align: center; color: var(--text-muted); font-size: 13px; padding: 40px 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div class="title-group">
          <img src="assets/logo.svg" alt="" class="logo-icon" />
          <span class="title">PawanRadar</span>
        </div>
        <div class="controls">
          <span class="updated" id="updatedLabel">Not loaded yet</span>
          <select id="sortSel">
            <option value="signal" selected>Sort: strongest buy first</option>
            <option value="severity">Sort: biggest dip first</option>
            <option value="ticker">Sort: ticker A-Z</option>
            <option value="price">Sort: price high to low</option>
          </select>
          <button id="refreshBtn">Refresh</button>
        </div>
      </div>

      <div class="legend">
        <span><span class="swatch" style="background:#FAEEDA;"></span>below 7d low</span>
        <span><span class="swatch" style="background:#FAC775;"></span>below 15d low</span>
        <span><span class="swatch" style="background:#EF9F27;"></span>below 30d low</span>
        <span><span class="swatch" style="background:#BA7517;"></span>below 90d low</span>
        <span><span class="swatch" style="background:#F7C1C1;"></span>below 180d low</span>
        <span><span class="swatch" style="background:#E24B4A;"></span>below 365d low</span>
      </div>
      <div class="legend">
        <span><span class="swatch" style="background:#E6F1FB;"></span>above 7d high</span>
        <span><span class="swatch" style="background:#B9D9F5;"></span>above 15d high</span>
        <span><span class="swatch" style="background:#7FB8E6;"></span>above 30d high</span>
        <span><span class="swatch" style="background:#4A93D1;"></span>above 90d high</span>
        <span><span class="swatch" style="background:#1E5C96;"></span>above 180d high</span>
        <span><span class="swatch" style="background:#0D3E68;"></span>above 365d high</span>
      </div>

      <div id="rows">
        <div class="empty-state">Click Refresh to load your watchlist.</div>
      </div>
    </div>

    <script>
      // ---- Configuration ----
      var TICKERS = ["AAPL","NVDA","GOOGL","AMZN","GOOG","AVGO","META","TSLA","MU","AMD","INTC","CAT","NFLX","SPCX","CRM","NOW","PANW","DOCU"];
      var WORKER_URL = "https://stock-watchlist-proxy.pawan227.workers.dev/";

      var COLS = ["7d","15d","30d","90d","180d","365d"];
      var STYLE = {
        "7d":   { border: "#EF9F27", bg: "#FAEEDA", text: "#633806", label: "Below 7d low",   rank: 1 },
        "15d":  { border: "#EF9F27", bg: "#FAC775", text: "#633806", label: "Below 15d low",  rank: 2 },
        "30d":  { border: "#BA7517", bg: "#EF9F27", text: "#412402", label: "Below 30d low",  rank: 3 },
        "90d":  { border: "#854F0B", bg: "#BA7517", text: "#FAEEDA", label: "Below 90d low",  rank: 4 },
        "180d": { border: "#A32D2D", bg: "#F7C1C1", text: "#501313", label: "Below 180d low", rank: 5 },
        "365d": { border: "#791F1F", bg: "#E24B4A", text: "#FCEBEB", label: "Below 365d low", rank: 6 }
      };

      // Mirrors STYLE, but for breakouts above a window's high. Blue so it never
      // gets confused with the amber-to-red "dip" ramp above, which is a different
      // signal (buying opportunity vs. take-profit/extended).
      var HIGH_STYLE = {
        "7d":   { border: "#4A93D1", bg: "#E6F1FB", text: "#0D3E68", label: "Above 7d high",   rank: 1 },
        "15d":  { border: "#2F7FCB", bg: "#B9D9F5", text: "#0D3E68", label: "Above 15d high",  rank: 2 },
        "30d":  { border: "#1E6BB8", bg: "#7FB8E6", text: "#0B2540", label: "Above 30d high",  rank: 3 },
        "90d":  { border: "#14568F", bg: "#4A93D1", text: "#FBFAF7", label: "Above 90d high",  rank: 4 },
        "180d": { border: "#0D3E68", bg: "#1E5C96", text: "#FBFAF7", label: "Above 180d high", rank: 5 },
        "365d": { border: "#082A47", bg: "#0D3E68", text: "#FBFAF7", label: "Above 365d high", rank: 6 }
      };

      var lastData = [];

      // Composite Strong Buy..Strong Sell signal, scored from the same badges shown
      // on the card. Not a recommendation to act on blindly — a summary of what the
      // other badges already say, weighted toward the "dip" philosophy of this page.
      var SIGNAL_TIERS = [
        { min: 5,           label: "Strong Buy",  bg: "#B7DDAC", text: "#1B4D0F", rank: 5 },
        { min: 2,           label: "Buy",         bg: "#EAF3DE", text: "#27500A", rank: 4 },
        { min: -1,          label: "Hold",        bg: "#F1EFE8", text: "#6B6A63", rank: 3 },
        { min: -4,          label: "Sell",        bg: "#FCEBEB", text: "#501313", rank: 2 },
        { min: -Infinity,   label: "Strong Sell", bg: "#E9A6A6", text: "#4A0A0A", rank: 1 }
      ];
      var LOW_BREAK_VOTE = { "7d": 1, "15d": 1, "30d": 2, "90d": 2, "180d": 3, "365d": 3 };
      var HIGH_BREAK_VOTE = { "7d": -1, "15d": -1, "30d": -2, "90d": -2, "180d": -3, "365d": -3 };

      function computeSignal(row) {
        if (row.error) return null;
        var score = 0;

        var deepest = deepestOf(row);
        if (deepest) score += LOW_BREAK_VOTE[deepest];
        else {
          var deepestHigh = deepestHighOf(row);
          if (deepestHigh) score += HIGH_BREAK_VOTE[deepestHigh];
        }

        if (row.rsi !== null && row.rsi !== undefined) {
          if (row.rsi <= 30) score += 1;
          else if (row.rsi >= 70) score -= 1;
        }
        if (row.trend === "up") score += 1;
        else if (row.trend === "down") score -= 1;
        if (row.macd) score += row.macd.bullish ? 1 : -1;
        if (row.supertrend) score += row.supertrend.direction === "up" ? 1 : -1;
        if (row.bbands && row.bbands.breach === "lower") score += 1;
        else if (row.bbands && row.bbands.breach === "upper") score -= 1;

        // ADX doesn't vote on direction, it amplifies whichever way the score already leans.
        if (row.adx && row.adx.strong) score += score > 0 ? 1 : (score < 0 ? -1 : 0);

        for (var i = 0; i < SIGNAL_TIERS.length; i++) {
          if (score >= SIGNAL_TIERS[i].min) return SIGNAL_TIERS[i];
        }
        return SIGNAL_TIERS[SIGNAL_TIERS.length - 1];
      }

      function signalBadgeHtml(signal) {
        if (!signal) return "";
        return '<span class="signal-badge" style="background:' + signal.bg + ';color:' + signal.text + ';">' + signal.label + '</span>';
      }

      function deepestOf(row) {
        var deepest = null;
        for (var i = 0; i < COLS.length; i++) {
          var c = COLS[i];
          var w = row.windows ? row.windows[c] : null;
          if (w && row.price < w.low) deepest = c;
        }
        return deepest;
      }

      function deepestHighOf(row) {
        var deepest = null;
        for (var i = 0; i < COLS.length; i++) {
          var c = COLS[i];
          var w = row.windows ? row.windows[c] : null;
          if (w && row.price > w.high) deepest = c;
        }
        return deepest;
      }

      function fmt(n) {
        if (n === null || n === undefined || isNaN(n)) return "—";
        return "$" + n.toFixed(2);
      }

      // ---- Indicator badges ----

      function rsiBadgeHtml(rsi) {
        if (rsi === null || rsi === undefined) return "";
        var bg = "#F1EFE8", text = "#444441", label = "RSI " + rsi;
        if (rsi <= 30) { bg = "#EAF3DE"; text = "#27500A"; label = "RSI " + rsi + " oversold"; }
        else if (rsi >= 70) { bg = "#FAEEDA"; text = "#633806"; label = "RSI " + rsi + " overbought"; }
        return '<span class="indicator-badge" style="background:' + bg + ';color:' + text + ';">' + label + '</span>';
      }

      function trendBadgeHtml(trend) {
        if (!trend) return "";
        var up = trend === "up";
        var bg = up ? "#EAF3DE" : "#FCEBEB";
        var text = up ? "#27500A" : "#501313";
        return '<span class="indicator-badge" style="background:' + bg + ';color:' + text + ';">' + (up ? "Uptrend" : "Downtrend") + '</span>';
      }

      function volBadgeHtml(relVol) {
        if (relVol === null || relVol === undefined || relVol < 1.5) return "";
        return '<span class="indicator-badge" style="background:#E6F1FB;color:#042C53;">' + relVol.toFixed(1) + 'x volume</span>';
      }

      function macdBadgeHtml(macd) {
        if (!macd) return "";
        var bg = macd.bullish ? "#EAF3DE" : "#FCEBEB";
        var text = macd.bullish ? "#27500A" : "#501313";
        return '<span class="indicator-badge" style="background:' + bg + ';color:' + text + ';">MACD ' + (macd.bullish ? "bullish" : "bearish") + '</span>';
      }

      function adxBadgeHtml(adx) {
        if (!adx || !adx.strong) return "";
        return '<span class="indicator-badge" style="background:#EDE7F6;color:#3B2A66;">Strong trend (ADX ' + adx.value + ')</span>';
      }

      function supertrendBadgeHtml(st) {
        if (!st) return "";
        var up = st.direction === "up";
        var bg = up ? "#EAF3DE" : "#FCEBEB";
        var text = up ? "#27500A" : "#501313";
        return '<span class="indicator-badge" style="background:' + bg + ';color:' + text + ';">Supertrend ' + (up ? "▲" : "▼") + ' ' + fmt(st.value) + '</span>';
      }

      function bbandsBadgeHtml(bb) {
        if (!bb || !bb.breach) return "";
        var upper = bb.breach === "upper";
        var bg = upper ? "#FAEEDA" : "#EAF3DE";
        var text = upper ? "#633806" : "#27500A";
        return '<span class="indicator-badge" style="background:' + bg + ';color:' + text + ';">' + (upper ? "Above upper band" : "Below lower band") + '</span>';
      }

      function buildCard(row) {
        if (row.error) {
          return '<div class="card"><div class="card-head"><span class="ticker">' + row.symbol +
            '</span><span class="error-card">' + row.error + '</span></div></div>';
        }

        var deepest = deepestOf(row);
        var deepestHigh = deepest ? null : deepestHighOf(row);
        var s = deepest ? STYLE[deepest] : (deepestHigh ? HIGH_STYLE[deepestHigh] : null);
        var borderColor = s ? s.border : "var(--border)";

        var head = '<div class="card-head">' +
          '<div class="ticker-price"><span class="ticker">' + row.symbol + '</span>' +
          '<span class="price">' + fmt(row.price) + '</span>' +
          (row.atr !== null && row.atr !== undefined ? '<span class="atr-value">ATR ' + fmt(row.atr) + '</span>' : '') +
          '</div>';
        if (s) {
          head += '<span class="badge" style="background:' + s.bg + ';color:' + s.text + ';">' + s.label + '</span>';
        } else {
          head += '<span class="no-signal">No new low/high</span>';
        }
        head += '</div>';

        var signal = computeSignal(row);
        var signalRow = signal ? '<div>' + signalBadgeHtml(signal) + '</div>' : '';

        var badges = '<div class="badges-row">' +
          rsiBadgeHtml(row.rsi) +
          trendBadgeHtml(row.trend) +
          volBadgeHtml(row.relVol) +
          macdBadgeHtml(row.macd) +
          adxBadgeHtml(row.adx) +
          supertrendBadgeHtml(row.supertrend) +
          bbandsBadgeHtml(row.bbands) +
          '</div>';

        var grid = '<div class="windows-grid">';
        for (var i = 0; i < COLS.length; i++) {
          var c = COLS[i];
          var w = row.windows ? row.windows[c] : null;
          grid += '<div><div class="win-label">' + c + '</div>';
          if (!w) {
            grid += '<div class="win-na">insufficient history</div>';
          } else {
            var brokenLow = row.price < w.low;
            var brokenHigh = row.price > w.high;
            var lowColor = brokenLow ? STYLE[c].border : "var(--text-primary)";
            var highColor = brokenHigh ? HIGH_STYLE[c].border : "var(--text-secondary)";
            grid += '<div class="win-low" style="font-weight:' + (brokenLow ? "600" : "400") + ';color:' + lowColor + ';">L ' + fmt(w.low) + '</div>';
            grid += '<div class="win-high" style="font-weight:' + (brokenHigh ? "600" : "400") + ';color:' + highColor + ';">H ' + fmt(w.high) + '</div>';
          }
          grid += '</div>';
        }
        grid += '</div>';

        return '<div class="card" style="border-left-color:' + borderColor + ';">' + head + signalRow + badges + grid + '</div>';
      }

      function render(sortBy) {
        var container = document.getElementById("rows");
        if (!lastData.length) return;

        var rows = lastData.slice();
        rows.forEach(function (r) { r._deepest = r.error ? null : deepestOf(r); });

        if (sortBy === "severity") {
          rows.sort(function (a, b) {
            var rankA = a._deepest ? STYLE[a._deepest].rank : 0;
            var rankB = b._deepest ? STYLE[b._deepest].rank : 0;
            return rankB - rankA;
          });
        } else if (sortBy === "signal") {
          rows.sort(function (a, b) {
            var rankA = a.error ? 0 : computeSignal(a).rank;
            var rankB = b.error ? 0 : computeSignal(b).rank;
            return rankB - rankA;
          });
        } else if (sortBy === "ticker") {
          rows.sort(function (a, b) { return a.symbol.localeCompare(b.symbol); });
        } else if (sortBy === "price") {
          rows.sort(function (a, b) { return (b.price || 0) - (a.price || 0); });
        }

        container.innerHTML = rows.map(buildCard).join("");
      }

      function setLoading(isLoading) {
        var btn = document.getElementById("refreshBtn");
        btn.disabled = isLoading;
        btn.textContent = isLoading ? "Refreshing…" : "Refresh";
      }

      function loadData() {
        setLoading(true);
        lastData = [];
        document.getElementById("rows").innerHTML = '<div class="empty-state">Loading…</div>';
        document.getElementById("updatedLabel").textContent = "Loading…";

        var url = WORKER_URL + "?symbols=" + encodeURIComponent(TICKERS.join(","));
        fetch(url)
          .then(function (res) {
            if (!res.ok) throw new Error("Request failed: " + res.status);
            return res.json();
          })
          .then(function (json) {
            if (json.error) throw new Error(json.error);
            lastData = json.data || [];
            render(document.getElementById("sortSel").value);
            document.getElementById("updatedLabel").textContent = "Updated " + new Date().toLocaleTimeString();
            setLoading(false);
          })
          .catch(function (err) {
            document.getElementById("rows").innerHTML =
              '<div class="empty-state">Could not load data: ' + err.message + '</div>';
            document.getElementById("updatedLabel").textContent = "Not loaded yet";
            setLoading(false);
          });
      }

      document.getElementById("refreshBtn").addEventListener("click", loadData);
      document.getElementById("sortSel").addEventListener("change", function (e) {
        render(e.target.value);
      });
    </script>
  </body>
</html>
